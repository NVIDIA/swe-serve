#
# Every push and pull request must leave execution files matching manifest.json; the check this
# produces is the one branch protection requires before merging. Pull requests from forks
# are checked out read-only under the plain pull_request event, with no write token.
name: verify-manifest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_manifest.py
